name = "rendro"
main = "src/worker.ts"
compatibility_date = "2025-07-06"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Raw invocation URLs contain private viewer capabilities. Only our redacted
# application request logs may be persisted; do not enable URL-bearing traces.
[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[secrets]
# Match the mandatory runtime settings validated in src/config.ts.
required = ["CONVEX_INTERNAL_SECRET", "AUTH_SECRET", "IMAGE_PROXY_SECRET"]

# Blob storage is the native R2 binding: the Worker holds no S3 access key, and the bucket must
# stay private (no r2.dev URL, no public custom domain; `pnpm check:r2-public` verifies it).
# RETENTION_SECRET is also a Worker secret, kept optional so a deployment without it still serves
# traffic. Without it the nightly purge reports itself disabled.
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "rendro-docs"

# Nightly purge of expired deployments (src/retention.ts), at 03:23 UTC.
[triggers]
crons = ["23 3 * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
# Include favicon.svg and favicon.ico; the Worker supplies MIME and cache headers.
run_worker_first = true

[vars]
NODE_ENV = "production"

# ── Dev environment (deployed from `development` branch) ──
[env.development]
name = "rendro-dev"

[env.development.secrets]
# Match the mandatory runtime settings validated in src/config.ts.
required = ["CONVEX_INTERNAL_SECRET", "AUTH_SECRET", "IMAGE_PROXY_SECRET"]

[[env.development.r2_buckets]]
binding = "STORAGE"
bucket_name = "dev-rendro"

[env.development.triggers]
crons = ["23 3 * * *"]

[env.development.vars]
NODE_ENV = "production"

[env.development.observability]
enabled = true

[env.development.observability.logs]
enabled = true
invocation_logs = false

[env.development.observability.traces]
enabled = false

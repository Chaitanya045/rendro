name = "rendro"
main = "src/worker.ts"
compatibility_date = "2025-07-06"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[secrets]
# Match the mandatory runtime settings validated in src/config.ts.
required = ["CONVEX_INTERNAL_SECRET", "AUTH_SECRET", "MINIO_ENDPOINT", "MINIO_ACCESS_KEY", "MINIO_SECRET_KEY"]

[assets]
directory = "./public"
binding = "ASSETS"
# Include favicon.svg and favicon.ico; the Worker supplies MIME and cache headers.
run_worker_first = true

[vars]
NODE_ENV = "production"

# ── Dev environment (deployed from `development` branch) ──
[env.development]
name = "rendro-dev"

[env.development.secrets]
# Match the mandatory runtime settings validated in src/config.ts.
required = ["CONVEX_INTERNAL_SECRET", "AUTH_SECRET", "MINIO_ENDPOINT", "MINIO_ACCESS_KEY", "MINIO_SECRET_KEY"]

[env.development.vars]
NODE_ENV = "production"

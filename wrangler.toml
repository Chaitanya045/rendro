name = "rendro"
main = "src/worker.ts"
compatibility_date = "2025-07-06"
compatibility_flags = ["nodejs_compat"]

# Production serves on the rendro.app Custom Domain (needed for the shared cache tier, TECHNICAL.md).
routes = [{ pattern = "rendro.app", custom_domain = true }]

[observability]
enabled = true

# Raw invocation URLs contain private viewer capabilities. Only our redacted
# application request logs may be persisted; do not enable URL-bearing traces.
[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[secrets]
# Match the mandatory runtime settings validated in src/config.ts.
required = ["CONVEX_INTERNAL_SECRET", "IMAGE_PROXY_SECRET", "REPO_CAPABILITY_SECRET", "REPO_CONTENT_KEY"]

[assets]
directory = "./public"
binding = "ASSETS"
# Include favicon.svg and favicon.ico; the Worker supplies MIME and cache headers.
run_worker_first = true

[vars]
NODE_ENV = "production"
SITE_URL = "https://rendro.app"
GITHUB_APP_CLIENT_ID = "Iv23liYJQvRuXGKsT2Pm"
GITHUB_APP_SLUG = "rendro-app"
# GitHub-only sign-in (the same value is set in Convex production).
AUTH_EMAIL_SIGN_IN = "off"

# Rendered repository snapshots: the ingest Worker's bucket (read only here).
[[r2_buckets]]
binding = "REPO_CONTENT"
bucket_name = "rendro-ingest"

# Revocation epochs the control Worker writes.
[[kv_namespaces]]
binding = "REPO_EPOCHS"
id = "a3319594a05a46a49ee7330197d22635"

# The permission source. Without the entrypoint every permission check is a 503.
[[services]]
binding = "REPO_ACCESS"
service = "rendro-control"
entrypoint = "RepoAccessService"

[[d1_databases]]
binding = "REPO_SEARCH"
database_name = "rendro-repo-search"
database_id = "f00f4a20-0ba1-4c33-b184-d70e6487ceb2"

[[durable_objects.bindings]]
name = "REPO_INGEST"
class_name = "RepoIngestCoordinator"
script_name = "rendro-ingest"

# Rate limiters: same limits as development, namespace IDs unique in the account.
[[ratelimits]]
name = "RUM_LIMIT"
namespace_id = "2821"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "FIRST_VIEW_LIMIT"
namespace_id = "2942"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "SEARCH_LIMIT"
namespace_id = "2943"
simple = { limit = 60, period = 60 }

# RUM_ANALYTICS (Analytics Engine dataset "rendro_rum") is left out until Analytics Engine is enabled on the
# account (`wrangler deploy` fails with code 10089 while it is off); /rum accepts and drops beacons meanwhile.

# ── Dev environment (deployed from `development` branch) ──
[env.development]
name = "rendro-dev"

[env.development.secrets]
# Match the mandatory runtime settings validated in src/config.ts.
required = ["CONVEX_INTERNAL_SECRET", "IMAGE_PROXY_SECRET", "REPO_CAPABILITY_SECRET", "REPO_CONTENT_KEY"]

# Real-user monitoring beacons (POST /rum, #282). Development only: production gets its dataset and
# limiter at its own deploy. Without either binding the endpoint accepts beacons and drops them.
# The dataset binding is commented out until Analytics Engine is enabled on the Cloudflare account
# (owner action; `wrangler deploy` fails with code 10089 while it is off). Restore these three lines then.
# [[env.development.analytics_engine_datasets]]
# binding = "RUM_ANALYTICS"
# dataset = "rendro_rum_dev"

# The beacon's in-colo rate limit, keyed on the verified client address (#282): 60 beacons a minute per
# address, against about one per page leave. Development only, like the dataset; without it beacons are dropped.
[[env.development.ratelimits]]
name = "RUM_LIMIT"
namespace_id = "2820"
simple = { limit = 60, period = 60 }

# Per-client admission on the repository read path (#294), keyed on the verified client address like RUM_LIMIT.
# First views of a branch other than the default (each may make the ingest coordinator ask GitHub about the
# branch): 20 a minute per address, which a reader's preparing-page polls never approach. Without this binding
# such first views are refused (the default branch still prepares). Development only, like RUM_LIMIT.
[[env.development.ratelimits]]
name = "FIRST_VIEW_LIMIT"
namespace_id = "2940"
simple = { limit = 20, period = 60 }

# Repository searches: 60 a minute per address, against the shell's one request per 200 ms typing pause.
# Without this binding searches are not limited per client (the index is scoped per repository either way).
[[env.development.ratelimits]]
name = "SEARCH_LIMIT"
namespace_id = "2941"
simple = { limit = 60, period = 60 }

[env.development.vars]
NODE_ENV = "production"

[env.development.observability]
enabled = true

[env.development.observability.logs]
enabled = true
invocation_logs = false

[env.development.observability.traces]
enabled = false

name: Test stability

# Surfaces intermittent failures early. The coverage suite runs twice on two CPUs
# (the constrained configuration that exposed #151) and any difference in
# per-test outcomes or in per-counter coverage hits between the runs fails the
# workflow. The end-to-end suite runs once per engine (in two shards) with retries disabled.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
  # Only changes to this workflow itself, so edits to it are exercised before merge.
  pull_request:
    paths:
      - .github/workflows/stability.yml

permissions:
  contents: read

concurrency:
  group: stability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VITEST_MAX_WORKERS: "2"

jobs:
  coverage-twice:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rendro-e2e
          key: ${{ runner.os }}-${{ runner.arch }}-convex-precompiled-2026-10-06-a3538c6-archive-v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Vitest cleans coverage/ on every run, so each run's reports are copied
      # out. RENDRO_TEST_OUTCOMES makes Vitest also write its per-test JSON report.
      - name: Coverage run 1
        env:
          RENDRO_TEST_OUTCOMES: ${{ runner.temp }}/stability/run1/outcomes.json
        run: |
          mkdir -p "$RUNNER_TEMP/stability/run1"
          status=0
          taskset -c 0,1 pnpm coverage || status=$?
          cp coverage/merged/coverage-final.json "$RUNNER_TEMP/stability/run1/" || true
          exit $status
      # Always run the second pass: a failure in only one of two identical runs is a flake.
      - name: Coverage run 2
        if: ${{ !cancelled() }}
        env:
          RENDRO_TEST_OUTCOMES: ${{ runner.temp }}/stability/run2/outcomes.json
        run: |
          mkdir -p "$RUNNER_TEMP/stability/run2"
          status=0
          taskset -c 0,1 pnpm coverage || status=$?
          cp coverage/merged/coverage-final.json "$RUNNER_TEMP/stability/run2/" || true
          exit $status
      # Empty output is success; every difference is one JSON line and fails the step.
      - name: Compare per-test outcomes
        if: ${{ !cancelled() }}
        run: pnpm exec tsx tests/helpers/diff-outcomes.ts "$RUNNER_TEMP/stability/run1/outcomes.json" "$RUNNER_TEMP/stability/run2/outcomes.json"
      - name: Compare coverage counters
        if: ${{ !cancelled() }}
        run: pnpm exec tsx tests/helpers/diff-coverage.ts "$RUNNER_TEMP/stability/run1/coverage-final.json" "$RUNNER_TEMP/stability/run2/coverage-final.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: stability-coverage-reports
          path: ${{ runner.temp }}/stability/
          retention-days: 7
          if-no-files-found: warn

  e2e-no-retries:
    name: e2e-no-retries (${{ matrix.project }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        # Same split as quality.yml, so the nightly run keeps the same headroom.
        shard: [1, 2]
    env:
      WRANGLER_SEND_METRICS: "false"
      # Playwright reads this in e2e/playwright.config.ts; the first failure is final.
      E2E_RETRIES: "0"
      # Same split as quality.yml; see the comment there.
      PWTEST_SHARD_WEIGHTS: "47:63"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rendro-e2e
          key: ${{ runner.os }}-${{ runner.arch }}-convex-precompiled-2026-10-06-a3538c6-archive-v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - run: pnpm e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      # Redacted timings of the Worker's calls to the local backend and its queue gauges (#328),
      # so a backend stall can be told apart from a client race. Allowlisted fields only.
      - name: Slowest backend calls
        if: failure()
        run: pnpm exec tsx scripts/e2e-timings.ts test-results/e2e-timings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: stability-e2e-failures-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            test-results/e2e/
            test-results/e2e-timings/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

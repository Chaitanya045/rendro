name: Application quality gates

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITEST_MAX_WORKERS: "2"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rendro-e2e
          key: ${{ runner.os }}-${{ runner.arch }}-convex-precompiled-2026-10-06-a3538c6-archive-v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Vitest runs parallel unit tests first, then serial browser files.
      - run: pnpm verify
        env:
          ASSET_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      # No credentials or deployed test-user creation in untrusted PR jobs.
      - run: pnpm audit --audit-level=high

  # Rebuilds the ingest Markdown engine (wasm/comrak-engine) from its pinned
  # Rust crate and fails unless the output is byte-identical to the committed
  # wasm + wasm-bindgen glue. It runs in its own job so `pnpm verify` and
  # contributors never need a Rust toolchain; there it only checks the
  # committed artifact's SHA-256 (scripts/verify-comrak-wasm.ts).
  comrak-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # rust-toolchain.toml pins the compiler and target; wasm-bindgen-cli must
      # match the wasm-bindgen crate version or it refuses to run.
      - run: rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
        working-directory: wasm/comrak-engine
      - run: pnpm rebuild:wasm

  # One job per Playwright project and shard keeps wall time near half of the
  # slowest engine instead of the sum of all three. Each shard starts its own
  # harness (workerd, Convex, storage, seed data) on its own runner, so shards
  # share nothing. The aggregate `e2e` job below preserves the single required
  # check name. To change the shard count, update the `/2` in the job name and in
  # `--shard`, the `shard` list and PWTEST_SHARD_WEIGHTS; tests/repository-quality-gates.test.ts
  # checks they agree. Playwright cuts the test list into contiguous ranges, and the
  # first half (auth, organizations, comments) is about twice as slow per test as
  # the second (shell, viewer), so an even split by count leaves shard 1 with twice
  # the wall time. The weights give shard 1 about 43% of the tests; retune them from
  # the per-shard wall times in the job summaries (see docs/BROWSER_TESTS.md).
  e2e-engine:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2]
    env:
      VITEST_MAX_WORKERS: "2"
      WRANGLER_SEND_METRICS: "false"
      # Relative share of the tests per shard (shard 1 : shard 2).
      PWTEST_SHARD_WEIGHTS: "47:63"
    steps:
      # First step, so the duration guard at the end measures the whole job.
      - name: Record job start
        run: echo "E2E_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rendro-e2e
          key: ${{ runner.os }}-${{ runner.arch }}-convex-precompiled-2026-10-06-a3538c6-archive-v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      # Non-optional RPC gate (engine-independent): a missing backend fails, never skips.
      - name: Convex public RPC gate
        if: matrix.project == 'chromium'
        run: pnpm exec vitest run tests/convex-public-rpc.test.ts
      # One worker runs this shard of the engine's project; no credentials or deployed services.
      - run: pnpm e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: workerd-e2e-failures-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            test-results/e2e/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn
      # Blob reports let the e2e-report job merge the shards into one HTML report per engine.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7
          if-no-files-found: warn
      # Reshard before a shard nears its timeout. This warns instead of failing:
      # runner speed varies by tens of percent, and a hard failure at 60% would
      # block unrelated pull requests while the job still had 40% headroom. The
      # warning annotation and the job summary make the trend visible on every run.
      - name: Check shard duration
        if: ${{ always() }}
        env:
          TIMEOUT_MINUTES: "30"
          SHARD_NAME: ${{ matrix.project }} ${{ matrix.shard }}/2
        run: |
          elapsed=$(( $(date +%s) - E2E_JOB_START ))
          budget=$(( TIMEOUT_MINUTES * 60 * 60 / 100 ))
          minutes=$(awk -v s="$elapsed" 'BEGIN { printf "%.1f", s / 60 }')
          {
            echo "### e2e ($SHARD_NAME)"
            echo "Wall time: ${minutes} min of ${TIMEOUT_MINUTES} min timeout (warning above $(( budget / 60 )) min, 60%)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt "$budget" ]; then
            echo "::warning title=e2e shard near its timeout::e2e ($SHARD_NAME) took ${minutes} min, over 60% of the ${TIMEOUT_MINUTES} min timeout. Increase the shard count before cancellations start."
          fi

  # Visual baselines and accessibility scans (#120). Screenshots come from one pinned environment:
  # the Playwright container (by digest) that scripts/visual-baselines.sh starts, so a runner never
  # rasterises with its own fonts or libraries. A mismatch fails the job and uploads the expected,
  # actual and diff images; nothing is ever accepted automatically (docs/BROWSER_TESTS.md).
  visual:
    name: visual (chromium baselines)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VITEST_MAX_WORKERS: "2"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rendro-e2e
          key: ${{ runner.os }}-${{ runner.arch }}-convex-precompiled-2026-10-06-a3538c6-archive-v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-diffs
          path: |
            test-results/e2e-visual/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  # axe (WCAG 2.1 A/AA) over the same states on all three engines; rule-based, so it needs no
  # pinned container.
  a11y:
    name: a11y (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      VITEST_MAX_WORKERS: "2"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rendro-e2e
          key: ${{ runner.os }}-${{ runner.arch }}-convex-precompiled-2026-10-06-a3538c6-archive-v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - run: RENDRO_E2E_VISUAL=1 pnpm exec playwright test --config e2e/visual.config.ts --project=a11y-${{ matrix.project }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: a11y-failures-${{ matrix.project }}
          path: |
            test-results/e2e-visual/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  # Required check `e2e`: fails unless every engine job succeeded. `always()` is
  # needed so a failed or cancelled matrix leg is reported instead of skipping this job.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-engine
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Require every engine
        env:
          RESULT: ${{ needs.e2e-engine.result }}
        run: test "$RESULT" = success

  # Optional: one merged HTML report per engine when any shard failed. Nothing
  # depends on this job, so it can never change the required `e2e` result.
  e2e-report:
    name: e2e report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: e2e-engine
    if: ${{ !cancelled() && needs.e2e-engine.result == 'failure' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-${{ matrix.project }}-*
          path: all-blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html all-blob-reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: warn

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rendro-e2e
          key: ${{ runner.os }}-${{ runner.arch }}-convex-precompiled-2026-10-06-a3538c6-archive-v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm coverage
        env:
          VITEST_MAX_WORKERS: 2
          COVERAGE_DEBT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-summary
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/merged/coverage-summary.json
            coverage/merged/coverage-final.json
            coverage/browser/*.json
            coverage/subprocess/*.json
            coverage/node-canonical.json
            coverage/lcov.info
          if-no-files-found: error

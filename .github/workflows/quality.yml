name: Application quality gates

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:
  # The release workflow runs this exact gate before building artifacts.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VITEST_MAX_WORKERS: "2"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rendro-e2e
          key: ${{ runner.os }}-${{ runner.arch }}-convex-precompiled-2026-10-06-a3538c6-archive-v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Vitest runs parallel unit tests first, then serial browser files.
      - run: pnpm verify
        env:
          ASSET_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      # No credentials or deployed test-user creation in untrusted PR jobs.
      - run: pnpm audit --audit-level=high

  # One job per Playwright project keeps wall time near the slowest engine instead
  # of the sum of all three. The aggregate `e2e` job below preserves the single
  # required check name.
  e2e-engine:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    # Stopgap: WebKit now needs ~29-31 min unsharded. #226 shards the suite and restores a tight bound.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      VITEST_MAX_WORKERS: "2"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rendro-e2e
          key: ${{ runner.os }}-${{ runner.arch }}-convex-precompiled-2026-10-06-a3538c6-archive-v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.project }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: s3proxy-cache
        with:
          path: /tmp/rendro-s3proxy.tar
          key: s3proxy-87662b2a5afcdfa5f478a1c61650bae4c87bbd15f6ff2823236bcfd66ef7fe04
      - name: Load pinned local storage image
        if: steps.s3proxy-cache.outputs.cache-hit == 'true'
        run: docker load --input /tmp/rendro-s3proxy.tar
      - name: Resolve pinned local storage image
        run: docker pull andrewgaul/s3proxy@sha256:87662b2a5afcdfa5f478a1c61650bae4c87bbd15f6ff2823236bcfd66ef7fe04
      - name: Cache pinned local storage image
        if: steps.s3proxy-cache.outputs.cache-hit != 'true'
        run: docker save andrewgaul/s3proxy@sha256:87662b2a5afcdfa5f478a1c61650bae4c87bbd15f6ff2823236bcfd66ef7fe04 --output /tmp/rendro-s3proxy.tar
      # Non-optional RPC gate (engine-independent): a missing backend fails, never skips.
      - name: Convex public RPC gate
        if: matrix.project == 'chromium'
        run: pnpm exec vitest run tests/convex-public-rpc.test.ts
      # One worker runs this engine's project; no credentials or deployed services.
      - run: pnpm e2e --project=${{ matrix.project }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: workerd-e2e-failures-${{ matrix.project }}
          path: |
            test-results/e2e/
            playwright-report/
          retention-days: 7
          if-no-files-found: warn

  # Required check `e2e`: fails unless every engine job succeeded. `always()` is
  # needed so a failed or cancelled matrix leg is reported instead of skipping this job.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-engine
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Require every engine
        env:
          RESULT: ${{ needs.e2e-engine.result }}
        run: test "$RESULT" = success

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/rendro-e2e
          key: ${{ runner.os }}-${{ runner.arch }}-convex-precompiled-2026-10-06-a3538c6-archive-v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm coverage
        env:
          VITEST_MAX_WORKERS: 2
          COVERAGE_DEBT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-summary
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/merged/coverage-summary.json
            coverage/merged/coverage-final.json
            coverage/browser/*.json
            coverage/subprocess/*.json
            coverage/node-canonical.json
            coverage/lcov.info
          if-no-files-found: error

name: Deployment retention

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deployment-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cleanup:retention
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          RETENTION_SECRET: ${{ secrets.RETENTION_SECRET }}
          MINIO_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.R2_BUCKET }}
          MINIO_REGION: auto
          MINIO_FORCE_PATH_STYLE: "true"

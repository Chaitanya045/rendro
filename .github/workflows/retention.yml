name: Deployment retention

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: deployment-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cleanup:retention
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          RETENTION_SECRET: ${{ secrets.RETENTION_SECRET }}
          MINIO_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          MINIO_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          MINIO_BUCKET: ${{ secrets.R2_BUCKET }}
          MINIO_REGION: auto
          MINIO_FORCE_PATH_STYLE: "true"
